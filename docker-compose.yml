version: "3.8"

services:
  # ==================== Middleware ====================

  mysql:
    image: mysql:8.4.11
    container_name: qlink-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2
    container_name: qlink-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: qlink-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    # Apache Kafka 官方镜像 (KRaft-only)。注意: 环境变量前缀为 KAFKA_ (点转下划线),
    # 原 KAFKA_CFG_ 前缀是 Bitnami 风格, 在 Confluent/Apache 官方镜像上不生效
    image: apache/kafka:4.3.1
    container_name: qlink-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 双监听器: 宿主机走 9092 (advertised localhost), 容器间走 9094 (advertised kafka)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 单节点必须降副本因子, 否则 __consumer_offsets 创建失败导致消费组不可用
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.11.7
    container_name: qlink-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: visit_stats
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  minio:
    image: minio/minio:latest
    container_name: qlink-minio
    ports:
      - "9010:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # ==================== Application Services ====================

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: qlink-gateway
    ports:
      - "8888:8888"
    environment:
      PORT: "8888"
      LINK_SERVICE: "http://link:8003"
      DATA_SERVICE: "http://data:8002"
      ACCOUNT_SERVICE: "http://account:8001"
      SHOP_SERVICE: "http://shop:8005"
      AI_SERVICE: "http://ai:8006"
    depends_on:
      - link
      - data
      - account
      - shop
      - ai

  account:
    build:
      context: .
      dockerfile: Dockerfile
      target: account
    container_name: qlink-account
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PWD: "${MYSQL_PWD:-root}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/"
      STORAGE_TYPE: "minio"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_BUCKET: "aqicloud"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-http://localhost:9010/aqicloud}"
      SMS_PROVIDER: "log"
      SHOP_SERVICE: "http://shop:8005"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  link:
    build:
      context: .
      dockerfile: Dockerfile
      target: link
    container_name: qlink-link
    ports:
      - "8003:8003"
    environment:
      PORT: "8003"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PWD: "${MYSQL_PWD:-root}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/"
      KAFKA_BROKERS: "kafka:9092"
      ACCOUNT_SERVICE: "http://account:8001"
      RPC_TOKEN: "rpc-token-default"
      ALERT_TYPE: "log"
      # ALERT_WEBHOOK_URL: "https://oapi.dingtalk.com/robot/send?access_token=xxx"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  data:
    build:
      context: .
      dockerfile: Dockerfile
      target: data
    container_name: qlink-data
    ports:
      - "8002:8002"
    environment:
      PORT: "8002"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "9000"
    depends_on:
      - clickhouse

  shop:
    build:
      context: .
      dockerfile: Dockerfile
      target: shop
    container_name: qlink-shop
    ports:
      - "8005:8005"
    environment:
      PORT: "8005"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PWD: "${MYSQL_PWD:-root}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/"
      # Alipay sandbox (leave empty for mock mode)
      ALI_APP_ID: "${ALI_APP_ID:-}"
      ALI_PRIVATE_KEY: "${ALI_PRIVATE_KEY:-}"
      ALI_PUBLIC_KEY: "${ALI_PUBLIC_KEY:-}"
      ALI_GATEWAY: "${ALI_GATEWAY:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}"
      ALI_NOTIFY_URL: "${ALI_NOTIFY_URL:-}"
      # WeChat Pay sandbox (leave empty for mock mode)
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_MCH_ID: "${WECHAT_MCH_ID:-}"
      WECHAT_API_KEY: "${WECHAT_API_KEY:-}"
      WECHAT_NOTIFY_URL: "${WECHAT_NOTIFY_URL:-}"
      WECHAT_PAY_ENV: "${WECHAT_PAY_ENV:-sandbox}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai
    container_name: qlink-ai
    ports:
      - "8006:8006"
    environment:
      PORT: "8006"
      AI_PROVIDER: "ollama"
      AI_API_KEY: ""
      AI_BASE_URL: "${AI_BASE_URL:-http://localhost:11434/v1}"
      AI_MODEL: "qwen3.5:9b"

  streamer:
    build:
      context: .
      dockerfile: Dockerfile
      target: streamer
    container_name: qlink-streamer
    environment:
      KAFKA_BROKERS: "kafka:9094"
      REDIS_ADDR: "redis:6379"
      REDIS_PWD: ""
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PWD: ""
      CLICKHOUSE_DB: "visit_stats"
      AMAP_API_KEY: "${AMAP_API_KEY:-}"
      TZ: "Asia/Shanghai"
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_started

volumes:
  mysql_data:
  minio_data:
